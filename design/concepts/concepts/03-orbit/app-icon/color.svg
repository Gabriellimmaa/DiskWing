<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">DiskWing · Orbit · color</title><desc id="desc">O anel sugere a ocupação do disco. Um segmento se desprende e ganha uma ponta de asa: uma metáfora para espaço recuperado. O círculo permanece forte nas versões pequenas.</desc><rect x="96" y="96" width="832" height="832" rx="186" fill="#C86315"/><rect x="100" y="100" width="824" height="824" rx="182" fill="none" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="2"/><g transform="translate(192 192) scale(5)"><path fill="#FFFFFF" d="M62 17A47 47 0 1 0 109 64H85A23 23 0 1 1 62 41Z"/><path fill="#FFFFFF" d="M75 17L120 9L111 54L96 35Z"/></g></svg>
