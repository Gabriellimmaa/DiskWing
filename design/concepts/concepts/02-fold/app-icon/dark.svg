<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">DiskWing · Fold · dark</title><desc id="desc">Uma construção compacta em uma única forma. A letra D se reconhece pela haste e pela curva externa; os vazios diagonais sugerem penas e movimento. É o conceito mais contido.</desc><rect x="96" y="96" width="832" height="832" rx="186" fill="#172435"/><rect x="100" y="100" width="824" height="824" rx="182" fill="none" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="2"/><g transform="translate(192 192) scale(5)"><path fill="#FFFFFF" fill-rule="evenodd" d="M21 16H58C92 16 112 35 112 64S92 112 58 112H21Q17 112 17 108V20Q17 16 21 16ZM43 41V78L80 41ZM45 94H57C79 94 91 82 88 56Z"/></g></svg>
